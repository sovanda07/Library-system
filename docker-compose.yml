services:

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - book_service_1
      - book_service_2
    networks:
      - library-network

  api_gateway:
    image: mengkheangseng99/api-gateway
    build:
      context: .
      dockerfile: API_Gateway/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth_service
      - book_service_1
      - book_service_2
      - borrow_service
      - nginx
    networks:
      - library-network

  auth_service:
    image: mengkheangseng99/auth-service
    build:
      context: .
      dockerfile: Auth_service/Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - library-network

  book_service_1:
    image: mengkheangseng99/book-service
    build:
      context: .
      dockerfile: Book_service/Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - library-network

  book_service_2:
    image: mengkheangseng99/book-service
    build:
      context: .
      dockerfile: Book_service/Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - library-network

  borrow_service:
    image: mengkheangseng99/borrow-service
    build:
      context: .
      dockerfile: Borrow_service/Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - BOOK_SERVICE_URL=http://nginx:8080
    depends_on:
      - book_service_1
      - book_service_2
    networks:
      - library-network

  redis:
    image: redis:latest
    networks:
      - library-network

networks:
  library-network:
    driver: bridge