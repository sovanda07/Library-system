apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-sys-ingress
  namespace: library-system
spec:
  ingressClassName: nginx
  rules:
    - host: library.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: library-sys-api-gateway
                port:
                  number: 4000