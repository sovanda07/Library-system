apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-sys-book-service
  namespace: library-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-sys-book-service
  template:
    metadata:
      labels:
        app: library-sys-book-service
    spec:
      containers:
        - name: library-sys-book-service
          image: sovanda07/library-sys-book-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: library-config
            - secretRef:
                name: library-secrets
          env:
            - name: PORT
              value: "3001"
          volumeMounts:
            - name: shared-logs
              mountPath: /shared/logs
        - name: shared-writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /shared/logs
              for i in 1 2 3; do echo "book-service: $(date)" >> /shared/logs/book.txt && break || sleep 1; done
              sleep 3600
          volumeMounts:
            - name: shared-logs
              mountPath: /shared/logs
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: library-sys-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: library-sys-book-service
  namespace: library-system
spec:
  selector:
    app: library-sys-book-service
  ports:
    - port: 3001
      targetPort: 3001
