apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-sys-auth-service
  namespace: library-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-sys-auth-service
  template:
    metadata:
      labels:
        app: library-sys-auth-service
    spec:
      containers:
        - name: library-sys-auth-service
          image: sovanda07/library-sys-auth-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: library-config
            - secretRef:
                name: library-secrets
          env:
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: library-sys-auth-service
  namespace: library-system
spec:
  selector:
    app: library-sys-auth-service
  ports:
    - port: 3000
      targetPort: 3000
